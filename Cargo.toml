[workspace]
resolver = "2"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the facade a host depends on is `crates/tinymemory`, the same as any
# other member. Every member is also a default member, so the four contract
# commands build and test all of them.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository. Each one
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees"]

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

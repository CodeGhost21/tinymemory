name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cuts the version bump, the tag and a GitHub release. Nothing is published
  # to crates.io: every crate is `publish = false` and hosts take this
  # repository by git or path, pinned to a tag. There are no binary artifacts;
  # the source at the tag is the release.
  tag:
    name: Tag release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The root manifest is a virtual workspace, so name the facade
          # rather than taking whichever package cargo lists first.
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="tinymemory"
          current_version="$(
            jq -r --arg name "$crate_name" \
              '.packages[] | select(.name == $name) | .version' <<< "$metadata"
          )"
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # Bumps the facade's `[package]` version only. That is sufficient because
      # no intra-workspace path dependency carries a `version = "…"`
      # requirement; the guard below keeps it that way.
      - name: Update crate version
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail

          offenders="$(
            grep -rn --include=Cargo.toml -E \
              '^tinymemory(-[a-z]+)? *= *\{[^}]*version *=' crates || true
          )"
          if [[ -n "$offenders" ]]; then
            echo "An intra-workspace path dependency carries a version requirement:" >&2
            echo "$offenders" >&2
            echo "Nothing here is published, so drop 'version' and keep 'path'." >&2
            exit 1
          fi

          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' \
            crates/tinymemory/Cargo.toml
          cargo update -p "$CRATE_NAME" --precise "$NEXT_VERSION"

      - name: Commit version bump and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tinymemory/Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" --verify-tag --generate-notes

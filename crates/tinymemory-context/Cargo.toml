[package]
name = "tinymemory-context"
publish = false
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "Compiles a token-budgeted context.md brief from any TinyMemory engine"

[dependencies]
# The engine the brief is compiled from, and the items it cites.
tinymemory-api = { path = "../tinymemory-api" }
# `ContextDoc::generated_at` is stamped from the system clock.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# A brief whose recall fails is skipped and logged, not fatal.
log = "0.4"
# `ContextSpec` and `Brief` are host configuration.
serde = { version = "1", features = ["derive"] }
# The crate-wide `Error`.
thiserror = "2"

[dev-dependencies]
tinymemory-conformance = { path = "../tinymemory-conformance" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

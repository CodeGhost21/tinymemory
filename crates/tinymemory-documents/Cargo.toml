[package]
name = "tinymemory-documents"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "Document intake for TinyMemory: sniff a format, convert it to markdown, emit a StoreItem::Document"
publish = false

[dependencies]
# The contract. Intake emits `StoreItem::Document` with the caller's
# `MemoryMeta`, so the item it builds is exactly what an engine stores.
tinymemory-api = { path = "../tinymemory-api" }
# `DocumentConverter` is an object-safe async trait: a host swaps the converter
# (a PDF or DOCX extractor) without this crate knowing which one it got.
async-trait = "0.1"
# `ConvertedDocument::metadata` is an open `Value` a converter fills with
# whatever it learned (page count, author, its own name).
serde_json = "1"
# `DocumentFormat` and `ConvertedDocument` cross host boundaries as JSON.
serde = { version = "1", features = ["derive"] }
# The crate-wide `Error`.
thiserror = "2"

[dev-dependencies]
# The converter and item paths are async.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

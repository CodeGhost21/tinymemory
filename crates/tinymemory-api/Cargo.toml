[package]
name = "tinymemory-api"
publish = false
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "The TinyMemory v2 contract: recall, fetch and store over typed memory items"

# The contract an engine compiles against. It performs no I/O and links no
# runtime, storage engine or HTTP stack; anything heavier belongs in an engine
# crate.
[dependencies]
# `MemoryEngine` is an object-safe trait of `async fn`s.
async-trait = "0.1"
# `MemoryMeta::observed_at`, `Turn::at` and the filter window are UTC instants.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# Every request, response and item crosses a host boundary as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `StoreItem::fingerprint`: the content-derived identity engines use to turn an
# identical retry into a replay rather than a duplicate.
sha2 = "0.10"
# The crate-wide `Error`.
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[package]
name = "tinymemory-conformance"
publish = false
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "The behavioural suite every TinyMemory engine must pass, plus a reference in-memory engine"

[dependencies]
# The contract the suite exercises and the reference engine implements.
tinymemory-api = { path = "../tinymemory-api" }
# `ReferenceEngine` implements the object-safe async `MemoryEngine` trait.
async-trait = "0.1"
# The crate-wide `Error`.
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

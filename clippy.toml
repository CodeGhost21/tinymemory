# `doc_markdown` (clippy::pedantic) flags any CamelCase-looking word in prose as
# a code item that forgot its backticks. These are product and technology names
# written as prose on purpose; backticking them would imply they name a Rust
# item. `..` keeps clippy's own default list rather than replacing it.
doc-valid-idents = [
    "..",
    "TinyMemory",
    "TinyCortex",
    "OpenHuman",
    "TinyBus",
    "SQLite",
    "snake_case",
    # Product names in `chunks::SourceKind`'s prose, not Rust items.
    "WhatsApp",
    "FastMail",
    # Toolkit names in `composio`'s prose, likewise.
    "ClickUp",
]
# A panic in a test is the failure report; library code is still held to no
# `unwrap`/`expect`/`panic` by each crate's `[lints]` table.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
